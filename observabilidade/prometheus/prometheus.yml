# =============================================================================
# Prometheus — quem coleta e guarda as métricas.
#
# Modelo de pull: é o Prometheus que vai buscar (`scrape`) o /metrics da aplicação de tempos em
# tempos, e não a aplicação que empurra. É o que permite a app não saber que o Prometheus existe
# e continuar subindo normalmente com a stack de observabilidade desligada.
# =============================================================================

global:
  # 15s é o padrão da casa e o que os dashboards assumem. Diminuir aumenta a resolução e o disco
  # na mesma proporção; aumentar quebra o `rate()` de janelas curtas, que precisa de pelo menos
  # duas amostras dentro da janela.
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    projeto: prephub

  # ⚠️ Nomes de métrica no formato clássico, com underscore.
  #
  # O OpenTelemetry nomeia os instrumentos com ponto (prephub.usuarios.cadastrados) e o
  # Prometheus 3 passou a aceitar isso: ele negocia UTF-8 no scrape e guarda o nome com ponto,
  # como veio. O efeito prático é que `sum(prephub_usuarios_cadastrados)` não encontra nada —
  # a série existe com OUTRO nome, e a consulta precisaria da sintaxe entre aspas
  # (`sum({"prephub.usuarios.cadastrados"})`), que quase nenhum exemplo, tutorial ou dashboard
  # da internet usa.
  #
  # Voltando ao esquema clássico, o exportador entrega os nomes já traduzidos para underscore e
  # tudo volta a se parecer com Prometheus. É o que os dashboards deste diretório assumem.
  metric_name_validation_scheme: legacy
  metric_name_escaping_scheme: underscores

scrape_configs:
  # ---- A aplicação --------------------------------------------------------
  # `web` é o nome do serviço no compose e resolve pelo DNS interno do Docker. A porta 9464 NÃO é
  # publicada no host de propósito: é a porta separada em que /metrics responde, alcançável só de
  # dentro desta rede. Ver Observabilidade:PortaDeMetricas no appsettings.
  - job_name: prephub
    metrics_path: /metrics
    static_configs:
      - targets:
          - "web:9464"
        labels:
          instancia: web

  # ---- O próprio Prometheus ----------------------------------------------
  # Barato e resolve a pergunta "o gráfico está vazio porque não houve tráfego ou porque a coleta
  # parou?" — sem isso os dois casos são visualmente idênticos.
  - job_name: prometheus
    static_configs:
      - targets:
          - "localhost:9090"
